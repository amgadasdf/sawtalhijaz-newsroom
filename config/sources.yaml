{
  "_meta": {
    "format": "YAML 1.2 using its JSON-compatible subset; parsed without third-party dependencies",
    "policy": "free-only; cache-first; per-source rolling-hour budgets; 2-6 second request spacing; 2/15/360 minute 429 backoff",
    "default_geo": "SA",
    "jitter_seconds": [2, 6],
    "backoff_minutes": [2, 15, 360],
    "lang_params": { "hl": "ar", "gl": "SA", "ceid": "SA:ar" }
  },
  "sources": {
    "trends-rss": {
      "type": "rss",
      "enabled": true,
      "url": "https://trends.google.com/trending/rss?geo=SA",
      "rate_limit_per_hour": 2,
      "cache_ttl_seconds": 1800,
      "max_items": 5,
      "timeout_ms": 20000
    },
    "gnews": {
      "type": "rss",
      "enabled": true,
      "url": "https://news.google.com/rss/search",
      "rate_limit_per_hour": 6,
      "cache_ttl_seconds": 600,
      "max_items": 5,
      "timeout_ms": 20000,
      "params": { "hl": "ar", "gl": "SA", "ceid": "SA:ar" },
      "general_query": "when:1h",
      "desk_queries": {
        "قرارات-أحداث": { "label": "قرار مجلس الوزراء", "query": "قرار مجلس الوزراء" },
        "تريند-الشارع": { "label": "تريند", "query": "تريند" },
        "روشن-الرياضية": { "label": "روشن رياضية", "query": "روشن رياضية" }
      }
    },
    "telegram": {
      "type": "html-preview",
      "enabled": true,
      "url_template": "https://t.me/s/{channel}",
      "channels": ["SabqOrg", "SaudiNews50", "AjelNews"],
      "rate_limit_per_hour": 4,
      "cache_ttl_seconds": 900,
      "max_items": 5,
      "timeout_ms": 20000
    },
    "wiki-top": {
      "type": "json-api",
      "enabled": true,
      "url_template": "https://wikimedia.org/api/rest_v1/metrics/pageviews/top/ar.wikipedia.org/all-access/{date}",
      "rate_limit_per_hour": 2,
      "cache_ttl_seconds": 21600,
      "max_items": 5,
      "timeout_ms": 20000
    },
    "wiki-rc": {
      "type": "json-api",
      "enabled": true,
      "url": "https://ar.wikipedia.org/w/api.php",
      "params": {
        "action": "query",
        "list": "recentchanges",
        "rclimit": "50",
        "format": "json",
        "rcprop": "title|timestamp|user|comment|flags|ids"
      },
      "rate_limit_per_hour": 2,
      "cache_ttl_seconds": 1800,
      "max_items": 5,
      "timeout_ms": 20000
    },
    "wayback-cdx": {
      "type": "cdx",
      "enabled": false,
      "run_mode": "weekly",
      "url": "https://web.archive.org/cdx/search/cdx",
      "domains": ["spa.gov.sa"],
      "match_type": "domain",
      "weekly_limit": 5,
      "rate_limit_per_hour": 1,
      "cache_ttl_seconds": 604800,
      "max_items": 5,
      "timeout_ms": 25000
    },
    "gdelt-files": {
      "type": "zip-csv",
      "enabled": true,
      "lastupdate_url": "https://data.gdeltproject.org/gdeltv2/lastupdate.txt",
      "rate_limit_per_hour": 2,
      "cache_ttl_seconds": 1800,
      "max_items": 5,
      "max_export_files_per_run": 1,
      "max_uncompressed_bytes": 50000000,
      "timeout_ms": 30000
    },
    "bing-dorks": {
      "type": "html-search",
      "enabled": true,
      "url": "https://www.bing.com/search",
      "rate_limit_per_hour": 6,
      "cache_ttl_seconds": 600,
      "max_items": 10,
      "timeout_ms": 20000
    },
    "bridge": {
      "type": "rss-bridge",
      "enabled": false,
      "approval_required": true,
      "url": "https://rss-bridge.org/bridge01/",
      "rate_limit_per_hour": 1,
      "cache_ttl_seconds": 21600,
      "max_items": 5,
      "timeout_ms": 20000
    }
  }
}
