name: live-radar

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/live-radar.yml", ".radar-net/radar-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node ops/live-radar-runner.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-radar-output
          path: |
            state/**
            out/**
